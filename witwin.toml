id = "witwin.maxwell"
name = "Maxwell"
version = "0.1.0"
author = ""
description = "FDTD electromagnetic field solver with 2D/3D visualization."
license = "GPL-3.0-or-later"
repository = "https://github.com/witwin-ai/wt_maxwell"
dependencies = ["witwin[maxwell]", "scipy", "numpy"]
icon = "waves"
enabled = true

[engines]
witwin = "^1.0.0"

[[contributes.solvers]]
id = "witwin.maxwell.fdtd"
title = "Maxwell FDTD"
entry = "solver_host.py"
lifecycle = "warm"
idleTimeoutSec = 300
cancelGraceSec = 5
maxParallel = 1

[contributes.solvers.runtime]
python = "${project:python}"

[contributes.solvers.capabilities]
cancel = true
partials = true
query = ["extract_slice", "extract_volume"]

# A Project template (Studio's template cards). The payload is copied as-is;
# every file is checked against the content manifest, whose sha256 is pinned
# here. Rebuild both with studio/scripts/build-template-manifest.mjs.
[[contributes.templates]]
id = "em-design"
title = "EM Design"
description = "A 1 GHz point dipole in a 1.2 m FDTD domain."
icon = "zap"
version = "1.0.0"
dir = "templates/em-design"
manifest = "template.manifest.json"
sha256 = "77abf575bd670ee4b527c330c719482af8feeab58b859ea2af40691fd882daf4"

# Generators: lines, passives, connectors, packages, periodic
# Model files (models/<folder>/<name>.py) that build parametric EM geometry;
# design formulas and conventions: docs/GENERATORS_LINES.md.
[[contributes.models]]
id = "witwin.maxwell.line.microstrip"
path = "models/lines/microstrip.py"
title = "Microstrip line"
category = "Transmission lines"
tags = ["microstrip", "50 ohm", "pcb", "hammerstad-jensen"]

[[contributes.models]]
id = "witwin.maxwell.line.stripline"
path = "models/lines/stripline.py"
title = "Stripline"
category = "Transmission lines"
tags = ["stripline", "50 ohm", "pcb"]

[[contributes.models]]
id = "witwin.maxwell.line.cpw"
path = "models/lines/cpw.py"
title = "Coplanar waveguide"
